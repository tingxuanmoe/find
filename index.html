<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>找不同游戏</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>找到所有不同！</h1>
        <p>关卡: <span id="level-counter">1</span></p>
        <p>剩余时间: <span id="timer">10:00</span></p>
    </header>
    <main>
        <div class="game-container">
            <div class="image-container" id="image-container-1">
                <canvas id="game-canvas-1" width="400" height="400"></canvas>
            </div>
            <div class="image-container" id="image-container-2">
                <canvas id="game-canvas-2" width="400" height="400"></canvas>
            </div>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
